[toolchain]
# Pinned to the minimum supported Rust version, which must equal
# `rust-version` in Cargo.toml. 1.88 is the oldest release that builds the
# locked dependency set (time 0.3.55 requires 1.88; zeroize, blake3 and
# others use edition 2024, which needs 1.85).
channel = "1.88.0"
profile = "minimal"
components = ["clippy"]
